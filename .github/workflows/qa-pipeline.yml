name: QA Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  qa-validation:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm ci

      - name: Run Application
        run: |
          node app/server.js &
          sleep 5

      - name: Smoke Test
        run: curl -f http://localhost:3000